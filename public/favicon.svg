<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="盘口走势折线">
  <!-- 品牌标：蓝色圆角方块 + 上行折线。
       折线就是本站的核心 —— 那张可点、可合成的盘口图（见 graph/），
       上行 + 一次回踩的形状是行情图的老实话，好处是**形状本身无法被商标独占**，
       不像一个具体产品名或图形组合那样有撞标风险。

       不留文字：品牌名还没定，标里带字母的话改一次名就要重画一套。
       将来定了名字，往中间加一个首字母（P / 球）是几分钟的事。

       配色与 src/index.css 的 --color-primary 同一个值，日后再改要一起改；
       位图那套由 scripts/icons/generate-icons.mjs 从同一份几何生成。 -->
  <rect width="100" height="100" rx="22" fill="#007aff"/>
  <path
    d="M24 70 L42 48 L58 60 L78 28"
    fill="none"
    stroke="#ffffff"
    stroke-width="9.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
